<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>splitbill</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap">
    <!-- daisyUI components (steps, rotating text, 3D hover), loaded on their own so the rest of the app keeps its look -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/components/steps.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/components/textrotate.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/components/hover3d.css">
    <link rel="stylesheet" href="style.css">
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="wrap bar-row">
            <span class="bar-side"></span>
            <h1 class="brand"><img src="assets/logo-white.png" alt="splitbill" width="637" height="105"></h1>
            <div class="bar-side end">
                <div class="lang-switch" role="group" data-i18n-aria="language">
                    <button type="button" data-lang="en" lang="en">EN</button>
                    <button type="button" data-lang="ms" lang="ms">BM</button>
                </div>
            </div>
        </div>
        <div class="wrap">
            <nav class="tabs" role="tablist">
                <button type="button" class="tab" role="tab" data-tab="shared" data-i18n="tabShared"></button>
                <button type="button" class="tab" role="tab" data-tab="individual" data-i18n="tabIndividual"></button>
                <button type="button" class="tab" role="tab" data-tab="owe" data-i18n="tabOwe"></button>
                <button type="button" class="tab" role="tab" data-tab="summary" data-i18n="tabSummary"></button>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <!-- Welcome (only while the trip has no friends yet) -->
        <section class="card welcome hidden" id="welcome">
            <h2 class="welcome-title">
                <span data-i18n="welcomeTitleLead"></span>
                <span class="text-rotate welcome-rotate">
                    <span>
                        <span data-i18n="welcomeRotate1"></span>
                        <span data-i18n="welcomeRotate2"></span>
                        <span data-i18n="welcomeRotate3"></span>
                        <span data-i18n="welcomeRotate4"></span>
                    </span>
                </span>
            </h2>
            <p class="muted" data-i18n="welcomeDesc"></p>
            <ol class="steps welcome-steps">
                <li class="step step-primary" style="--i:0">
                    <span class="step-icon"><span class="ico ico-user-plus" aria-hidden="true"></span><span class="step-num" aria-hidden="true">1</span></span>
                    <div class="hover-3d step-tilt">
                        <div class="step-card">
                            <h3 data-i18n="welcomeStepTitle1"></h3>
                            <p data-i18n="welcomeStep1"></p>
                        </div>
                        <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
                    </div>
                </li>
                <li class="step step-primary" style="--i:1">
                    <span class="step-icon"><span class="ico ico-bag" aria-hidden="true"></span><span class="step-num" aria-hidden="true">2</span></span>
                    <div class="hover-3d step-tilt">
                        <div class="step-card">
                            <h3 data-i18n="welcomeStepTitle2"></h3>
                            <p data-i18n="welcomeStep2"></p>
                        </div>
                        <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
                    </div>
                </li>
                <li class="step step-primary" style="--i:2">
                    <span class="step-icon"><span class="ico ico-share" aria-hidden="true"></span><span class="step-num" aria-hidden="true">3</span></span>
                    <div class="hover-3d step-tilt">
                        <div class="step-card">
                            <h3 data-i18n="welcomeStepTitle3"></h3>
                            <p data-i18n="welcomeStep3"></p>
                        </div>
                        <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
                    </div>
                </li>
            </ol>
            <div class="glass-wrap fx-layer">
                <button type="button" class="glass-btn start-btn" id="getStartedBtn">
                    <span class="text" data-i18n="getStarted"></span>
                    <span class="btn-icon" aria-hidden="true">
                        <svg class="svg" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                            <path d="M779.180132 473.232045 322.354755 16.406668c-21.413706-21.413706-56.121182-21.413706-77.534887 0-21.413706 21.413706-21.413706 56.122205 0 77.534887l418.057421 418.057421L244.819868 930.057421c-21.413706 21.413706-21.413706 56.122205 0 77.534887 10.706853 10.706853 24.759917 16.059767 38.767955 16.059767s28.061103-5.353938 38.767955-16.059767L779.180132 550.767955C800.593837 529.35425 800.593837 494.64575 779.180132 473.232045z"></path>
                        </svg>
                    </span>
                    <span class="circle-overlay" aria-hidden="true"></span>
                </button>
            </div>
        </section>

        <!-- Trip name and tools -->
        <section class="card trip-card">
            <input id="tripTitle" class="trip-title" data-i18n-ph="tripPlaceholder" data-i18n-aria="tripAria" autocomplete="off">
            <div class="toolbar">
                    <label class="currency">
                        <span data-i18n="currency"></span>
                        <input type="text" id="currency" maxlength="4" data-i18n-aria="currencyAria">
                    </label>
                    <button type="button" class="btn ghost small" id="exampleBtn" data-i18n="loadExample"></button>
                    <button type="button" class="btn ghost small" id="exportBtn" data-i18n="export"></button>
                    <label class="btn ghost small file-btn"><span data-i18n="import"></span><input type="file" id="importInput" accept="application/json,.json" hidden></label>
                    <button type="button" class="btn ghost small danger-text" id="resetBtn" data-i18n="clearAll"></button>
            </div>
        </section>

        <!-- Read with AI shortcut -->
        <section class="card ai-card" aria-labelledby="aiCardTitle">
            <div class="ai-card-text">
                <h2 id="aiCardTitle" data-i18n="aiCardTitle"></h2>
                <p class="muted" data-i18n="aiCardDesc"></p>
            </div>
            <button type="button" class="btn ai-card-btn" id="aiBtn" data-i18n="aiButton"></button>
        </section>

        <!-- Friends (always visible) -->
        <section class="card people-card">
            <h2 class="card-title" data-i18n="friends"></h2>
            <form id="addPersonForm" class="add-person">
                <input type="text" id="personName" autocomplete="off" data-i18n-ph="addFriendPh" data-i18n-aria="addFriendAria">
                <button type="submit" class="btn soft"><span class="ico ico-user-plus" aria-hidden="true"></span><span data-i18n="add"></span></button>
            </form>
            <ul id="peopleList" class="pills"></ul>
            <p class="muted people-count" id="peopleCount"></p>
        </section>

        <!-- 1. Shared expenses record -->
        <section class="panel" data-panel="shared">
            <div class="panel-head">
                <div>
                    <h2 data-i18n="sharedTitle"></h2>
                    <p class="muted" data-i18n="sharedDesc"></p>
                </div>
                <div class="head-actions">
                    <button type="button" class="btn" id="addExpenseBtn"><span class="ico ico-bag" aria-hidden="true"></span><span data-i18n="addExpense"></span></button>
                </div>
            </div>
            <div id="expenseList" class="expense-list"></div>

            <section class="card spend-card hidden" id="spendCard" aria-labelledby="spendTitle">
                <h3 id="spendTitle" class="card-title" data-i18n="spendTitle"></h3>
                <p class="muted small-text spend-desc" data-i18n="spendDesc"></p>
                <div class="spend-body">
                    <div class="pie-wrap">
                        <svg id="spendPie" class="pie" viewBox="0 0 200 200" role="img"></svg>
                        <div id="pieTip" class="pie-tip hidden" role="status"></div>
                    </div>
                    <div id="spendLegend" class="spend-legend"></div>
                </div>
            </section>
        </section>

        <!-- 2. Individual expenses record -->
        <section class="panel" data-panel="individual">
            <div class="panel-head">
                <div>
                    <h2 data-i18n="individualTitle"></h2>
                    <p class="muted" data-i18n-html="individualDesc"></p>
                </div>
            </div>
            <div id="individualList" class="person-grid"></div>
        </section>

        <!-- 3. Total amount owed -->
        <section class="panel" data-panel="owe">
            <div class="panel-head">
                <div>
                    <h2 data-i18n="oweTitle"></h2>
                    <p class="muted" data-i18n-html="oweDesc"></p>
                </div>
                <button type="button" class="btn" id="exportImgBtn" data-i18n="exportImg"></button>
            </div>
            <div class="card table-scroll" id="oweMatrix"></div>

            <div class="settle-grid">
                <div class="card">
                    <h3 data-i18n="fewestTitle"></h3>
                    <p class="muted small-text" data-i18n="fewestDesc"></p>
                    <ul id="simplifiedList" class="transfers"></ul>
                </div>
                <div class="card">
                    <h3 data-i18n="pairTitle"></h3>
                    <p class="muted small-text" data-i18n="pairDesc"></p>
                    <ul id="pairwiseList" class="transfers"></ul>
                </div>
            </div>

            <h3 class="sub-head" data-i18n="flowTitle"></h3>
            <div id="flowList" class="person-grid"></div>
        </section>

        <!-- 4. Summary -->
        <section class="panel" data-panel="summary">
            <div class="panel-head">
                <div>
                    <h2 data-i18n="summaryTitle"></h2>
                    <p class="muted" data-i18n="summaryDesc"></p>
                </div>
                <button type="button" class="btn" id="copyBtn" data-i18n="copyBtn"></button>
            </div>
            <p class="muted" id="copyStatus" aria-live="polite"></p>
            <div class="card table-scroll" id="billSummary"></div>
            <div class="card table-scroll" id="personSummary"></div>
        </section>
    </main>

    <!-- Add / edit expense -->
    <dialog id="expenseDialog" aria-labelledby="dialogTitle">
        <form id="expenseForm">
            <h2 id="dialogTitle"></h2>
            <div id="dialogBody"></div>
            <p class="error" id="dialogError" aria-live="assertive"></p>
            <div class="dialog-actions">
                <button type="button" class="btn ghost danger-text" id="deleteExpenseBtn" data-i18n="delete"></button>
                <span class="spacer"></span>
                <button type="button" class="btn ghost" id="cancelBtn" data-i18n="cancel"></button>
                <button type="submit" class="btn" data-i18n="save"></button>
            </div>
        </form>
    </dialog>

    <!-- Read with AI -->
    <dialog id="aiDialog" aria-labelledby="aiTitle">
        <div class="ai-body">
            <h2 id="aiTitle" data-i18n="aiTitle"></h2>

            <!-- Step 1: input -->
            <div id="aiInputStep" class="ai-step">
                <p class="muted" data-i18n="aiDesc"></p>
                <textarea id="aiText" rows="7" data-i18n-ph="aiTextPh" data-i18n-aria="aiTitle"></textarea>
                <div id="aiDrop" class="drop-zone">
                    <span id="aiDropText"></span>
                    <label class="btn ghost small file-btn"><span data-i18n="aiChoose"></span><input type="file" id="aiFiles" accept="image/*" multiple hidden></label>
                </div>
                <div id="aiThumbs" class="ai-thumbs"></div>
                <p class="error" id="aiError" aria-live="assertive"></p>
                <p class="muted hidden" id="aiLoading" aria-live="polite"><span class="spinner"></span> <span data-i18n="aiReading"></span></p>
                <div class="dialog-actions">
                    <span class="spacer"></span>
                    <button type="button" class="btn ghost" id="aiCancelBtn" data-i18n="cancel"></button>
                    <button type="button" class="btn" id="aiReadBtn" data-i18n="aiRead"></button>
                </div>
            </div>

            <!-- Step 2: preview -->
            <div id="aiPreviewStep" class="ai-step hidden">
                <p id="aiFound"></p>
                <div id="aiPreview"></div>
                <div class="dialog-actions">
                    <button type="button" class="btn ghost" id="aiBackBtn" data-i18n="aiBack"></button>
                    <span class="spacer"></span>
                    <button type="button" class="btn ghost" id="aiReplaceBtn" data-i18n="aiReplace"></button>
                    <button type="button" class="btn" id="aiAddBtn" data-i18n="aiAdd"></button>
                </div>
            </div>
        </div>
    </dialog>

    <!-- Export owed totals as an image -->
    <dialog id="exportDialog" aria-labelledby="exportTitle">
        <div class="ai-body">
            <h2 id="exportTitle" data-i18n="exportImgTitle"></h2>
            <div class="grid-2">
                <label class="field"><span data-i18n="exportWho"></span><select id="exportWho"></select></label>
                <div class="field"><span data-i18n="exportFormat"></span>
                    <div class="seg" id="exportFormat">
                        <button type="button" data-format="png" class="active">PNG</button>
                        <button type="button" data-format="jpeg">JPG</button>
                    </div>
                </div>
            </div>
            <canvas id="exportCanvas" class="export-preview"></canvas>
            <div class="dialog-actions">
                <span class="spacer"></span>
                <button type="button" class="btn ghost" id="exportCancelBtn" data-i18n="close"></button>
                <button type="button" class="btn" id="exportDownloadBtn" data-i18n="download"></button>
            </div>
        </div>
    </dialog>

    <!-- Receipt viewer -->
    <dialog id="imageDialog" class="image-dialog">
        <img id="imageView" alt="" data-i18n-aria="receipt">
        <form method="dialog"><button class="btn" data-i18n="close"></button></form>
    </dialog>

    <script src="i18n.js"></script>
    <script src="calc.js"></script>
    <script src="example.js"></script>
    <script src="script.js"></script>
</body>
</html>
